<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>MTE Scores</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>MTE Scores</h1>
        <a href="/add" class="btn btn-primary mb-3">Add Score</a>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Student Name</th>
                    <th>Reg Number</th>
                    <th>Subject Code</th>
                    <th>Subject Name</th>
                    <th>Score</th>
                    <th>Exam Date</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="score : ${scores}">
                    <td th:text="${score.id}"></td>
                    <td th:text="${score.studentName}"></td>
                    <td th:text="${score.registrationNumber}"></td>
                    <td th:text="${score.subjectCode}"></td>
                    <td th:text="${score.subjectName}"></td>
                    <td th:text="${score.score}"></td>
                    <td th:text="${score.examDate}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
