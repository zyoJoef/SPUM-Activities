<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add MTE Score</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Add New MTE Score</h1>
        <a href="/" class="btn btn-secondary mb-3">View All Scores</a>
        
        <form th:action="@{/add}" th:object="${score}" method="post" class="row g-3">
            <div class="col-md-6">
                <label for="studentName" class="form-label">Student Name</label>
                <input type="text" th:field="*{studentName}" class="form-control" id="studentName" required>
            </div>
            <div class="col-md-6">
                <label for="registrationNumber" class="form-label">Registration Number</label>
                <input type="text" th:field="*{registrationNumber}" class="form-control" id="registrationNumber" required>
            </div>
            <div class="col-md-6">
                <label for="subjectCode" class="form-label">Subject Code</label>
                <input type="text" th:field="*{subjectCode}" class="form-control" id="subjectCode" required>
            </div>
            <div class="col-md-6">
                <label for="subjectName" class="form-label">Subject Name</label>
                <input type="text" th:field="*{subjectName}" class="form-control" id="subjectName" required>
            </div>
            <div class="col-md-4">
                <label for="score" class="form-label">Score (0-100)</label>
                <input type="number" th:field="*{score}" step="0.01" min="0" max="100" class="form-control" id="score" required>
            </div>
            <div class="col-md-4">
                <label for="examDate" class="form-label">Exam Date</label>
                <input type="date" th:field="*{examDate}" class="form-control" id="examDate" required>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Add Score</button>
                <a href="/" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
