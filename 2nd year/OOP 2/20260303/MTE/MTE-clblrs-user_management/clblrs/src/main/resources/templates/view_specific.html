<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Details</title>
    <link rel="stylesheet" th:href="@{/specific_view.css}">
</head>

<body>

<div class="container">

    <h1 class="title">User Information</h1>

    <div class="user-card">

        <div class="info-row">
            <span class="label">ID</span>
            <span class="value" th:text="${user.id}"></span>
        </div>

        <div class="info-row">
            <span class="label">First Name</span>
            <span class="value" th:text="${user.firstName}"></span>
        </div>

        <div class="info-row">
            <span class="label">Last Name</span>
            <span class="value" th:text="${user.lastName}"></span>
        </div>

        <div class="info-row">
            <span class="label">Email</span>
            <span class="value" th:text="${user.email}"></span>
        </div>

        <div class="info-row">
            <span class="label">Role</span>
            <span class="value" th:text="${user.role}"></span>
        </div>

        <div class="info-row">
            <span class="label">Status</span>
            <span class="value" th:text="${user.status}"></span>
        </div>

        <div class="info-row">
            <span class="label">Created</span>
            <span class="value" th:text="${user.createdAt}"></span>
        </div>
        
        <div class="info-row">
            <span class="label">Updated</span>
            <span class="value" th:text="${user.updatedAt}"></span>
        </div>

    </div>

    <a th:href="@{/}" class="back-btn">Back to Home</a>

</div>

</body>
</html>
