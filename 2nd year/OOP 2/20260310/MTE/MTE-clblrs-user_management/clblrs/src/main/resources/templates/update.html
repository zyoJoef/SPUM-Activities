<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<title>Update User</title>
<link rel="stylesheet" th:href="@{crud.css}">
</head>

<body>

<div class="container">

<div class="header">
<h2>Update User</h2>
</div>

<form th:action="@{/edit}" th:object="${user}" method="post">

<input type="number" th:field="*{id}">

</form>

</div>

</body>
</html>
