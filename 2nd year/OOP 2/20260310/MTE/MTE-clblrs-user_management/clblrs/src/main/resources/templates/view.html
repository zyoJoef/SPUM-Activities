<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>View Users</title>
    <link rel="stylesheet" th:href="@{/crud.css}">
</head>

<body>

    <div class="container">

        <div class="header">
            <h2>All Users</h2>
        </div>

        <div th:if="${param.deleted}" 
     style="background-color: #d4edda; color: #155724; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #c3e6cb; text-align: center;">
    
    <p style="margin-bottom: 15px; font-weight: bold; font-size: 1.1rem;">
        User successfully deleted!
    </p>

    <a th:href="@{/}" style="text-decoration: none;">
        <button type="button" style="background-color: #155724; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
            Return to Dashboard
        </button>
    </a>
</div>

        <table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th th:if="${param.mode != null and param.mode[0] == 'delete'}">Action</th>
    </tr>

    <tr th:each="user : ${listUsers}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.firstName + ' ' + user.lastName}"></td>
        <td th:text="${user.email}"></td>

        <td class="action" th:if="${param.mode != null and param.mode[0] == 'delete'}">
            <a th:href="@{'/users/' + ${user.id}}">View</a>
            <a th:href="@{'/update/' + ${user.id}}">Update</a>
            <a th:href="@{'/confirm-delete/' + ${user.id}}">Delete</a>
        </td> 
    </tr>
</table>

    </div>

</body>
</html>
