<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>View Users</title>

<link rel="stylesheet" th:href="@{crud.css}">

</head>

<body>

<div class="container">

    <div class="card large-card">
        <h2>List of User's</h2>

        <div class="table-container">

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th>Updated</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="Users : ${listUsers}">
                        <td th:text="${Users.id}">User's ID</td>
                        <td th:text="${Users.firstName}">First Name</td>
                        <td th:text="${Users.lastName}">Last Name</td>
                        <td th:text="${Users.email}">Email</td>
                        <td th:text="${Users.role}">Role</td>
                        <td th:text="${Users.status}">Status</td>
                        <td th:text="${Users.createdAt}">Created At</td>
                        <td th:text="${Users.updatedAt}">Updated At</td>
                    </tr>
                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
