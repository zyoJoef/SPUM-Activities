<h2>Contact</h2>

<section class="contact-card">

<form
id="contactForm"
novalidate
>

<div class="name-row">

<div>

<label>
First Name
</label>

<input type="text" id="firstname" placeholder="Enter first name" required>

</div>

<div>

<label>
Last Name
</label>

<input type="text" id="lastname" placeholder="Enter last name" required>

</div>

</div>

<label>
Email Address
</label>

<input type="email" id="email" placeholder="example@gmail.com" required>

<label>
Subject
</label>

<input type="text" id="subject" placeholder="Enter subject" required>

<label>
Message
</label>

<textarea id="message" rows="7" maxlength="500" placeholder="Write your message..." required></textarea>

<div class="counter">

<span id="counter">0 / 500</span>

</div>

<button type="submit" id="sendBtn" disabled>Send Message</button>

</form>

</section>

<script>

const form = document.getElementById("contactForm");

const button = document.getElementById("sendBtn");

const message = document.getElementById("message");

const counter = document.getElementById("counter");

function validateForm(){

const fields = [

firstname,
lastname,
email,
subject,
message

];

const complete =
fields.every(
f =>
f.value
.trim()
!== ""
);

const validEmail =
email.checkValidity();

button.disabled =
!(
complete
&&
validEmail
);

}

message.addEventListener(
"input",
()=>{

counter.textContent =
`${message.value.length} / 500`;

validateForm();

}
);

form.addEventListener(
"input",
validateForm
);

form.addEventListener(
"submit",

function(e){

e.preventDefault();

if(
!form.checkValidity()
){

form.reportValidity();

return;

}

const body =

`First Name:
${firstname.value}

Last Name:
${lastname.value}

Email:
${email.value}

Message:

${message.value}`;

const gmail =

`https://mail.google.com/mail/?view=cm&fs=1&to=2024-0014@spumanila.edu.ph&su=${
encodeURIComponent(
subject.value
)
}&body=${
encodeURIComponent(
body
)
}`;

window.open(
gmail,
"_blank"
);

form.reset();

counter.textContent =
"0 / 500";

button.disabled =
true;

}

);

</script>
